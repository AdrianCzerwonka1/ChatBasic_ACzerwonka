<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 15px;
        }

        #messages {
            list-style: none;
            padding: 0;
            background: white;
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        #messages li {
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        /* bot messages in green */
        #messages li.bot {
            color: green;
            font-weight: bold;
        }

        input {
            padding: 6px;
            width: 300px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
        }

        #chat-section {
            display: none;
        }

        #hint {
            font-size: 0.85rem;
            color: gray;
            margin-top: 5px;
        }

        h3 {
            margin-bottom: 5px;
        }

        #user-list {
            list-style: none;
            padding: 0;
            margin-bottom: 15px;
        }

        #user-list li {
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>

<h1>Chat App</h1>

<!-- username setup -->
<div id="username-section">
    <input type="text" id="username-input" placeholder="Enter your username">
    <button onclick="setUsername()">Join Chat</button>
</div>

<!-- chat section -->
<div id="chat-section">

    <h3>Online Users</h3>
    <ul id="user-list"></ul>

    <ul id="messages"></ul>

    <input type="text" id="msg-input" placeholder="Type a message... use @bot to ask the bot">
    <button onclick="sendMessage()">Send</button>
    <p id="hint">Tip: Start your message with <strong>@bot</strong> to get an AI response</p>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io()

    function setUsername() {
        const username = document.getElementById('username-input').value.trim()
        if(!username) return

        socket.emit('set username', username)
        document.getElementById('username-section').style.display = 'none'
        document.getElementById('chat-section').style.display = 'block'
    }

    function sendMessage() {
        const input = document.getElementById('msg-input')
        const msg = input.value.trim()
        if(!msg) return

        socket.emit('chat message', msg)
        input.value = ''
    }

    // receive regular chat message
    socket.on('chat message', function(msg) {
        const li = document.createElement('li')
        li.textContent = msg
        document.getElementById('messages').appendChild(li)
    })

    // receive bot message - shown in green
    socket.on('bot message', function(msg) {
        const li = document.createElement('li')
        li.textContent = msg
        li.classList.add('bot')
        document.getElementById('messages').appendChild(li)
    })

    // update user list
    socket.on('user list', function(users) {
        const ul = document.getElementById('user-list')
        ul.innerHTML = ''
        users.forEach(function(user) {
            const li = document.createElement('li')
            li.textContent = user
            ul.appendChild(li)
        })
    })
</script>

</body>
</html>
